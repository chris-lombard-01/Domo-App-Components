<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Domo App Studio — Custom Nav Bar Preview</title>
<link rel="stylesheet" href="css/nav-bar.css" />
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    background: #fafbfb;
  }
  #app-body {
    padding: 24px;
    color: #33393a;
  }
  #app-body h2 { font-size: 16px; margin: 0 0 8px; }
  #app-body p { font-size: 13px; color: #6b7271; }
  pre#state-output {
    background: #ffffff;
    border: 1px solid #e0e4e3;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    color: #33393a;
    max-width: 480px;
    overflow-x: auto;
  }
</style>
</head>
<body>

  <!-- Mount point for the custom nav bar -->
  <div id="domo-nav-bar"></div>

  <div id="app-body">
    <h2>App Studio content area</h2>
    <p>This is a placeholder for your existing charts / vizzes. The nav bar above is fully self-contained — drop the markup, CSS, and JS into your App Studio app's index.html.</p>
    <p><strong>Live filter state</strong> (updates on every change — this is what you'd forward into your <code>domo.get</code> calls):</p>
    <pre id="state-output">{}</pre>
  </div>

<!-- Provided by the Domo runtime (both `domo dev` and a published app inject this).
     Safe to leave in even when opening this file in a plain browser — the script
     simply won't exist there, and the code below falls back to mock data. -->
<script src="domo.js"></script>
<script src="js/nav-bar.js"></script>
<script>
  // ---------------------------------------------------------
  // 1. Dataset wiring — these match manifest.json's datasetsMapping:
  //    DATASET_ALIAS is the dataset's "alias" ("BudgetBlindsData").
  //    Each LIVE_FILTERS.column is a field ALIAS from that mapping's
  //    "fields" array (not the raw columnName) — e.g. "Owner" resolves
  //    to the real column "FranchiseName" per manifest.json.
  // ---------------------------------------------------------
  var DATASET_ALIAS = "BudgetBlindsData";

  var LIVE_FILTERS = [
    { id: "brand",     column: "Brand",       allLabel: "All Brands" },
    { id: "masterId",  column: "HFCMasterID", allLabel: "All IDs" },
    { id: "owner",     column: "Owner",       allLabel: "All Owners" },
    { id: "territory", column: "TerrNumName", allLabel: "All Territories" }
  ];

  // Only used when this page is opened outside of Domo (no `domo` global),
  // so the preview still looks/works right at design time.
  var MOCK_OPTIONS = {
    brand: [
      { label: "All Brands", value: "all" },
      { label: "Acme Co.", value: "Acme Co." },
      { label: "Northwind", value: "Northwind" },
      { label: "Globex", value: "Globex" },
      { label: "Initech", value: "Initech" }
    ],
    masterId: [
      { label: "All IDs", value: "all" },
      { label: "MID-10231", value: "MID-10231" },
      { label: "MID-10312", value: "MID-10312" },
      { label: "MID-10399", value: "MID-10399" }
    ],
    owner: [
      { label: "All Owners", value: "all" },
      { label: "J. Alvarez", value: "J. Alvarez" },
      { label: "T. Nguyen", value: "T. Nguyen" }
    ],
    territory: [
      { label: "All Territories", value: "all" },
      { label: "Northeast", value: "Northeast" },
      { label: "Southeast", value: "Southeast" },
      { label: "West", value: "West" }
    ]
  };

  var IS_LIVE = typeof domo !== "undefined";

  var navBar = new DomoNavBar("#domo-nav-bar", {
    title: "Sales Performance",
    filters: LIVE_FILTERS.map(function (f) {
      return {
        id: f.id,
        label: f.id === "masterId" ? "Master ID" : f.id.charAt(0).toUpperCase() + f.id.slice(1),
        placeholder: f.allLabel,
        defaultValue: "all",
        // Start with just the "All ..." option; real values are filled in
        // by loadLiveFilterOptions() below once domo.get() resolves.
        options: IS_LIVE ? [{ label: f.allLabel, value: "all" }] : MOCK_OPTIONS[f.id]
      };
    }),
    periods: ["MTD", "QTD", "YTD", "Custom"],
    defaultPeriod: "MTD",
    trailingFilters: [
      {
        id: "compare",
        label: "Compare",
        placeholder: "No Comparison",
        defaultValue: "none",
        searchable: false,
        options: [
          { label: "No Comparison", value: "none" },
          { label: "Prior Period", value: "prior_period" },
          { label: "Prior Year", value: "prior_year" },
          { label: "Budget", value: "budget" },
          { label: "Forecast", value: "forecast" }
        ]
      }
    ]
  });

  // ---------------------------------------------------------
  // 2. Pull distinct values for each dropdown straight from the
  //    dataset, one groupby query per column, and push them into
  //    the nav bar once they resolve.
  // ---------------------------------------------------------
  function loadLiveFilterOptions() {
    LIVE_FILTERS.forEach(function (f) {
      var query =
        "/data/v1/" + DATASET_ALIAS +
        "?fields=" + encodeURIComponent(f.column) +
        "&groupby=" + encodeURIComponent(f.column) +
        "&orderby=" + encodeURIComponent(f.column);

      domo.get(query)
        .then(function (rows) {
          var options = [{ label: f.allLabel, value: "all" }].concat(
            rows
              .map(function (row) { return row[f.column]; })
              .filter(function (v) { return v !== null && v !== undefined && v !== ""; })
              .map(function (v) { return { label: String(v), value: String(v) }; })
          );
          navBar.setOptions(f.id, options);
        })
        .catch(function (err) {
          console.error("Failed to load options for " + f.id + " from " + query, err);
        });
    });
  }

  if (IS_LIVE) {
    loadLiveFilterOptions();
  }

  var stateOutput = document.getElementById("state-output");
  function renderState() {
    stateOutput.textContent = JSON.stringify(navBar.getState(), null, 2);
  }
  renderState();

  navBar.onChange(function (detail) {
    renderState();
    // ---------------------------------------------------------
    // Hook point: forward the updated filter state into whatever
    // queries drive your charts, e.g.:
    //
    // domo.get('/data/v1/salesDataset?' + buildQuery(detail.state))
    //   .then(function (rows) { renderCharts(rows); });
    // ---------------------------------------------------------
    console.log("Filter changed:", detail);
  });
</script>
</body>
</html>
