<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude Nav</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafbfb;
  }
  #app-body {
    margin-top: 24px;
    color: #2E3436;
  }
  #app-body h2 { font-size: 16px; margin: 0 0 8px; }
  #app-body p { font-size: 13px; color: #6b7271; }
</style>
</head>
<body>

<!-- ============================================
     NAV BAR
     ============================================ -->
<!-- Native <select> for every dropdown here on purpose: this app runs
     inside an iframe sized to its Domo card, so a custom-built
     position:absolute menu gets clipped the instant it would extend
     past the card's box — no z-index/CSS fix escapes that, since the
     clip is the iframe boundary itself, not an overflow style. Native
     select popups are painted by the browser above the page/iframe
     stacking context (the same reason the date pickers below already
     work), so they're the one dropdown style immune to this. Each
     select's first option (value="") IS the "All ..." state and also
     doubles as its own label, which is what let the separate
     small-caps caption above each control go away. -->
<div class="filter-bar" id="filterBar">

  <select class="pill-select" data-dropdown data-column="Brand">
    <option value="">All Brands</option>
    <option>Two Maids</option>
    <option>Bark &amp; Mane</option>
  </select>

  <select class="pill-select" data-dropdown data-column="HFCMasterID">
    <option value="">All IDs</option>
    <option>1001</option>
    <option>1002</option>
    <option>1003</option>
  </select>

  <select class="pill-select" data-dropdown data-column="FranchiseName">
    <option value="">All Owners</option>
    <option>Owner A</option>
    <option>Owner B</option>
  </select>

  <select class="pill-select" data-dropdown data-column="TerrNum">
    <option value="">All Territories</option>
    <option>West</option>
    <option>Midwest</option>
    <option>Southeast</option>
  </select>

  <div class="divider"></div>

  <!-- REPORTING PERIOD -->
  <div class="segmented" id="periodToggle">
    <button class="active" data-period>MTD</button>
    <button data-period>QTD</button>
    <button data-period>YTD</button>
    <button data-period="custom">Custom</button>
  </div>

  <!-- CUSTOM DATE RANGE — appears only when "Custom" is selected above -->
  <div class="date-range" id="dateRange">
    <input type="date" id="fromDate" class="pill-date">
    <span class="date-sep">to</span>
    <input type="date" id="toDate" class="pill-date">
  </div>

  <div class="spacer"></div>

  <!-- COMPARE — no data-column: it's a display mode, not a page filter -->
  <select class="pill-select" data-dropdown id="compareSelect">
    <option>Prior Period</option>
    <option>Prior Year</option>
    <option>No Comparison</option>
  </select>

</div>

<!-- ============================================
     APP CONTENT — your existing charts/cards go here
     ============================================ -->
<div id="app-body">
  <h2>App Studio content area</h2>
  <p>Placeholder for your existing charts/vizzes. They don't need to live inside this app — as long as they're built on a dataset sharing these columns, domo.filterContainer() calls from the nav bar above will filter them too.</p>
</div>

<!-- domo.js served via CDN — the relative "domo.js" path 404s in this
     app's real dashboard embed context (it is not auto-resolved the
     way DDX Bricks used to auto-inject window.domo). Confirmed against
     the live pro-code editor. app.js's domo.get/filterContainer calls
     are guarded to no-op if `domo` isn't defined regardless, so this
     stays safe to preview in a plain browser too. -->
<script src="https://cdn.domo.com/domo.js/1/domo.js"></script>
<script src="https://unpkg.com/ryuu.js@4.6.0/dist/domo.js" integrity="sha384-YYsd9wQ+wDlUWhvpfGdptxmNYIqBC+52oJtWgPKJadbs3sSFTY/+ZotPbEHTTRWz" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
